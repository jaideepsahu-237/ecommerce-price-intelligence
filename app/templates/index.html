<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce Price Intelligence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">📱 Price Intelligence</a>
        <span class="navbar-text text-white-50">Compare Vijay Sales, Reliance Digital & Poorvika</span>
    </div>
</nav>

<div class="container" style="max-width: 750px;">
    <div class="card shadow-sm border-0 mt-4">
        <div class="card-body p-4">
            <h4 class="card-title mb-3 fw-bold">Search Smartphones</h4>
            <p class="text-muted small">Compare prices, available discounts, and calculate indicative EMI across top Indian retailers.</p>
            
            <form action="/results" method="GET">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Mobile Model / Name</label>
                    <input type="text" name="query" class="form-control form-control-lg" placeholder="e.g. iPhone 16, Galaxy S25, OnePlus 13" required autofocus>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Storage</label>
                        <select name="storage" class="form-select">
                            <option value="">Any Storage</option>
                            <option value="128 GB">128 GB</option>
                            <option value="256 GB">256 GB</option>
                            <option value="512 GB">512 GB</option>
                            <option value="1 TB">1 TB</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Colour</label>
                        <input type="text" name="colour" class="form-control" placeholder="e.g. Black, Blue">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Retailer</label>
                        <select name="source" class="form-select">
                            <option value="all" selected>All Retailers</option>
                            <option value="vijay-sales">Vijay Sales</option>
                            <option value="reliance-digital">Reliance Digital</option>
                            <option value="poorvika">Poorvika</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Min Budget (₹)</label>
                        <input type="number" name="min_budget" class="form-control" placeholder="Optional" min="0" step="1000">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Max Budget (₹)</label>
                        <input type="number" name="max_budget" class="form-control" placeholder="Optional" min="0" step="1000">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Down Payment (₹)</label>
                        <input type="number" name="down_payment" class="form-control" value="0" min="0" step="1000">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">EMI Tenure</label>
                        <select name="tenure" class="form-select">
                            <option value="6">6 Months</option>
                            <option value="12" selected>12 Months</option>
                            <option value="18">18 Months</option>
                            <option value="24">24 Months</option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Interest Rate (% p.a.)</label>
                    <input type="number" name="annual_rate" class="form-control" value="14.0" step="0.5" min="0">
                    <div class="form-text">Set to 0 for No-Cost EMI estimate.</div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold">Search & Compare Prices</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
